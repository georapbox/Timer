<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer - Demo</title>
  <meta name="description" content="A lightweight, drift-free timer library built for the browser — precise, pause-resumable, and easy to use.">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="stylesheet" href="css/main.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <noscript>
    <div class="noscript-banner">
      <strong>JavaScript is disabled</strong><br>
      Some features may not work as expected. Please enable Javascript in your browser settings.
    </div>
  </noscript>

  <div class="container">
    <h1>Timer</h1>

    <p>A lightweight, drift-free timer library built for the browser — precise, pause-resumable, and easy to use.</p>

    <p><a href="https://github.com/georapbox/Timer" target="_blank" rel="noreferrer noopener">Source code & documentation</a></p>

    <h2>Demo</h2>

    <form id="form" autocomplete="off">
      <div>
        <label for="elapsed" class="form-label text-truncate">Elapsed time (ms):</label>
        <input class="form-control" id="elapsed" name="elapsed" type="number" min="0" max="30000" step="100" value="0" required>
      </div>

      <div>
        <label for="duration" class="form-label text-truncate">Duration (ms):</label>
        <input class="form-control" id="duration" name="duration" type="number" min="0" max="60000" step="100" value="60000" required>
      </div>

      <input class="btn" type="submit" value="New instance">
    </form>

    <div class="actions">
      <button id="start" type="button" class="btn action" title="Start timer">
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" class="bi bi-play-fill" viewBox="0 0 16 16" aria-hidden="true">
          <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/>
        </svg>
      </button>

      <button id="stop" type="button" class="btn action" title="Stop timer">
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" class="bi bi-pause-fill" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5zm5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5z"/>
        </svg>
      </button>

      <button id="reset" type="button" class="btn action" title="Reset timer">
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" class="bi bi-stop-fill" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M5 3.5h6A1.5 1.5 0 0 1 12.5 5v6a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 11V5A1.5 1.5 0 0 1 5 3.5z"/>
        </svg>
      </button>
    </div>

    <div class="result">
      Elapsed (ms): <code id="resElapsed"></code>
      <br>
      Remaining (ms): <code id="resRemaining"></code>
      <br>
      <progress></progress>
    </div>

    <h2>License</h2>

    <p>Licensed under the <a href="https://github.com/georapbox/Timer/blob/master/LICENSE" target="_blank" rel="noreferrer noopener">The MIT License (MIT)</a></p>
  </div>
</body>
</html>
